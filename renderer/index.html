<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Si tu app necesita hablar
     con una API, agregá su origen a connect-src y nada más. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Pharos</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0c0a09;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f2f4f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el canto primero, la mesa detrás. */
  #boot-splash path { stroke-dasharray: 34; stroke-dashoffset: 34;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  /* La luz del faro: entra después de la torre y se queda tenue. Encender la
     luz es lo último que pasa, como en un faro de verdad. */
  #boot-splash path:last-child { stroke-dasharray: 11; stroke-dashoffset: 11;
                                 opacity: .34; animation-delay: .22s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <path d="M6.5 13.7 7.1 6.7h1.8l.6 7zM6.7 6.7V4.5h2.6v2.2M4.6 13.7h6.8"/>
    <path d="M5.2 3.4 3 2.3M10.8 3.4 13 2.3"/>
  </svg>
</div>

<div class="ox-app">

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="ox-brand ox-no-drag" data-tip="Pharos" id="brand">
      <svg class="ox-brand__mark ox-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M6.5 13.7 7.1 6.7h1.8l.6 7zM6.7 6.7V4.5h2.6v2.2M4.6 13.7h6.8"/>
        <path class="ox-brand__trail" d="M5.2 3.4 3 2.3M10.8 3.4 13 2.3"/>
      </svg>
      <span class="ox-brand__name">Pharos</span>
    </div>

    <button class="ox-iconbtn ox-iconbtn--sm ox-no-drag" id="btn-palette"
            data-tip="Comandos" data-tip-key="Ctrl K"><i data-icon="search"></i></button>

    <!-- Contexto de la vista actual. Lo llena el router. -->
    <div class="ox-titlebar__context" id="titlebar-context"></div>

    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <div class="ox-body">

    <!-- ── Rail ──────────────────────────────────────────────────────────── -->
    <nav class="ox-rail">
      <div class="ox-rail__nav ox-scroll">
        <div class="ox-rail__group">
          <button class="ox-navitem" data-view="buscar">
            <i data-icon="search"></i> Buscar
          </button>
          <button class="ox-navitem" data-view="favoritos">
            <i data-icon="estrella"></i> Favoritos <span class="ox-navitem__count">0</span>
          </button>
          <button class="ox-navitem" data-view="carrito">
            <i data-icon="carrito"></i> Carrito <span class="ox-navitem__count">0</span>
          </button>
          <button class="ox-navitem" data-view="historial">
            <i data-icon="clock"></i> Historial <span class="ox-navitem__count">0</span>
          </button>
        </div>

        <div class="ox-rail__group">
          <div class="ox-rail__group-label">Sistema</div>
          <button class="ox-navitem" data-view="ajustes">
            <i data-icon="settings"></i> Ajustes
          </button>
        </div>
      </div>

      <div class="ox-rail__foot" id="rail-foot"></div>
    </nav>

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="ox-main" id="view"></main>
  </div>

  <!-- ── Statusbar ───────────────────────────────────────────────────────── -->
  <footer class="ox-statusbar">
    <div class="ox-statusbar__item" id="stat-descuento"
         data-tip="El descuento se cambia en la ficha de cualquier producto o en el carrito" data-tip-side="top">
      <i data-icon="porcentaje"></i> <span class="ox-statusbar__value">sin descuento</span>
    </div>
    <div class="ox-statusbar__item" id="stat-carrito" data-goto="carrito"
         data-tip="Lo que va a salir el carrito, con lo que cada fila decidió" data-tip-side="top">
      <i data-icon="carrito"></i> <span class="ox-statusbar__value">carrito vacío</span>
    </div>
    <div class="ox-statusbar__item"
         data-tip="Los precios salen del Manual Farmacéutico" data-tip-side="top">
      <i data-icon="globe"></i> <span class="ox-statusbar__value">alfabeta.net</span>
    </div>
    <div class="ox-spacer"></div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>

<script type="module" src="./js/app.js"></script>
